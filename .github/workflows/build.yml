name: Build LKM

on:
  workflow_dispatch:
    inputs:
      kmi:
        description: "GKI KMI version to build"
        required: false
        default: "android12-5.10"
        type: choice
        options:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget python3 zip llvm

      # ddk 是 KernelSU LKM 官方构建工具 (fork of Ylarod/ddk)。
      - name: Install ddk
        run: |
          curl -fsSL https://raw.githubusercontent.com/Ylarod/ddk/main/scripts/ddk -o ddk
          chmod +x ddk
          sudo mv ddk /usr/local/bin/ddk
          # 预先写入 source 配置，避免非交互环境下 ddk 等待用户输入而退出
          mkdir -p ~/.ddk
          echo "github" > ~/.ddk/source
          which ddk
          cat ~/.ddk/source

      # 仓库内已包含改好的 kernel 源码（含 ksu_hide_uid 补丁），
      # 直接用它来编，不依赖外部 tag。
      - name: Build LKM with ddk (docker mode)
        run: |
          cd kernelsu-kernel
          KMI="${{ github.event.inputs.kmi || 'android12-5.10' }}"
          echo "Building for KMI: $KMI"
          set -x
          ddk pull "$KMI"
          ddk build "$KMI" -e CONFIG_KSU=m
          echo "ddk build exit code: $?"

      - name: Find, strip and collect artifact
        run: |
          cd kernelsu-kernel
          KO=$(find . -name 'kernelsu.ko' | head -n1)
          if [ -z "$KO" ]; then
            echo "kernelsu.ko not found, listing tree:"; find . -name '*.ko' | head -n20
            exit 1
          fi
          echo "Found: $KO"
          llvm-strip -d "$KO" 2>/dev/null || strip "$KO"
          cp "$KO" "$GITHUB_WORKSPACE/kernelsu.ko"
          ls -l "$GITHUB_WORKSPACE/kernelsu.ko"

      - name: Upload kernel_su LKM
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-module
          path: kernelsu.ko
